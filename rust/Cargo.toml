[package]
name = "jev-demo"
version = "0.1.0"
edition = "2021"
description = "Jev intuition service. Direct AI Gateway evaluate call, same JSON contract as the TypeScript service."

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
